<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco Informatica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stile.css">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div id="messaggioFeedback" class="alert d-none text-center mb-3" role="alert"></div>

            <div id="sezioneLogin" class="card card-custom p-4">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4 fw-bold" style="color: #a370f7;">Accedi al Gioco</h3>
                    
                    <form id="formLogin" onsubmit="event.preventDefault(); InviaLogin();">
                        <div class="mb-3">
                            <label for="loginUser" class="form-label text-secondary fw-semibold">Username</label>
                            <input type="text" id="loginUser" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label for="loginPass" class="form-label text-secondary fw-semibold">Password</label>
                            <input type="password" id="loginPass" class="form-control" required>
                        </div>
                        <button type="submit" class="btn w-100 fw-bold mb-3" style="background-color: #6f42c1; color: #fff;">Entra</button>
                        
                        <div class="text-center">
                            <span class="text-secondary">Non hai un account? </span>
                            <a href="#" onclick="MostraRegistrazione();" class="text-decoration-none" style="color: #a370f7;">Registrati qui</a>
                        </div>
                    </form>
                </div>
            </div>

            <div id="sezioneRegistrati" class="card card-custom p-4 d-none">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4 fw-bold" style="color: #3b82f6;">Crea Account</h3>
                    
                    <form id="formRegistrati" onsubmit="event.preventDefault(); InviaRegistrazione();">
                        <div class="mb-3">
                            <label for="regUser" class="form-label text-secondary fw-semibold">Username</label>
                            <input type="text" id="regUser" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPass" class="form-label text-secondary fw-semibold">Password</label>
                            <input type="password" id="regPass" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label for="regFazione" class="form-label text-secondary fw-semibold">Fazione</label>
                            <select id="regFazione" class="form-select" required>
                                <option value="informatica">Informatica</option>
                                <option value="Sistemi e reti">Sistemi e reti</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">Registrati</button>
                        
                        <div class="text-center">
                            <span class="text-secondary">Hai già un account? </span>
                            <a href="#" onclick="MostraLogin();" class="text-decoration-none" style="color: #3b82f6;">Accedi</a>
                        </div>
                    </form>
                </div>
            </div>

            <div id="sezioneGioco" class="card card-custom p-4 d-none">
                <div class="card-body text-center">
                    
                    <h3 class="mb-2 fw-bold">Benvenuto, <span id="nomeGiocatore" class="text-warning">Utente</span>!</h3>
                    <p class="text-secondary">Fazione: <span id="fazioneGiocatore" class="badge bg-info">Fazione</span></p>
                    
                    <hr class="border-secondary my-4">

                    <div class="mb-4">
                        <span class="text-secondary d-block small text-uppercase fw-semibold">I tuoi click totali</span>
                        <h1 id="contatoreClick" class="display-3 fw-bold text-success">0</h1>
                    </div>

                    <button id="btnClicker" class="btn btn-success btn-lg w-100 py-4 fw-bold fs-2 shadow" onclick="SpammaClick();">
                        CLICCA! 💻
                    </button>
                    
                    <button class="btn btn-outline-danger btn-sm mt-4" onclick="EseguiLogout();">
                        Esci dal Gioco
                    </button>

                </div>
            </div>

            <div id="sezioneClassifica" class="card card-custom p-4 mt-4">
                <div class="card-body">
                    <h4 class="card-title text-center mb-3 fw-bold" style="color: #0d6efd;">Punteggio Fazioni</h4>
                    
                    <div id="corpoClassifica" class="text-center text-secondary small mb-4">
                        Caricamento classifica in corso...
                    </div>

                    <hr class="border-secondary my-3">

                    <div class="text-center mb-3">
                        <button id="btnMostraGiocatori" class="btn btn-sm btn-outline-info" onclick="ToggleClassificaGiocatori();">
                            Mostra Classifica Giocatori 🏆
                        </button>
                    </div>

                    <div id="areaGiocatori" class="d-none">
                        <h5 class="text-center text-warning mb-3 fw-bold">Top Player Singoli</h5>
                        
                        <div id="corpoClassificaGiocatori"></div>
                        
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <button id="btnPagPrecedente" class="btn btn-dark btn-sm" onclick="PaginaPrecedente();" disabled>⬅️ Precedente</button>
                            <span id="testoPagina" class="small text-secondary fw-bold">Pagina 1</span>
                            <button id="btnPagSuccessiva" class="btn btn-dark btn-sm" onclick="PaginaSuccessiva();">Successiva ➡️</button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
